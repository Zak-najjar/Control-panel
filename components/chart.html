{{#> components-container title="chart"}}
  <div class="c-chart">
    <header class="c-chart__header">
      <div class="c-chart__header__title">
        <h4 class="c-chart__title">
          المبيعات
        </h4>
        <span class="c-chart__date">
          1 اكتوبر 2025
        </span>
      </div>
      <div class="c-summary c-summary--small c-summary--boxless c-summary--spaceless">
        <div class="c-summary__data">
          <div class="c-summary__key">التغيير الشهري</div>
          <div class="c-summary__value--positive">16.6%</div>
        </div>
        <div class="c-summary__data">
          <div class="c-summary__key">المجموع</div>
          <div class="c-summary__value">$96343</div>
        </div>
        <div class="c-summary__data">
          <div class="c-summary__key">اخر ثلاثين يوم</div>
          <div class="c-summary__value">$1345</div>
        </div>
      </div>
      <div class="c-table__navigation">
        <div class="c-table__navigation__arrows">
          <button class="c-btn c-btn--icon"><i class=" fa-solid fa-arrow-right"></i></button>
          <button class="c-btn c-btn--icon"><i class=" fa-solid fa-arrow-left"></i></button>
        </div>
      </div>
    </header>

    <canvas class="c-chart__data" id="example-chart" width="600" height="300"></canvas>
  </div>

<script type="module">
  import Chart from 'chart.js/auto';
  const ctx = document.getElementById('example-chart');

  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ['يناير', 'فبراير', 'مارس', 'ابريل', 'ماي', 'يوليو', 'اغسطس', 'سبتمبر', 'اكتوبر', 'نوفمبر', 'ديسمبر'],
      datasets: [{
        label: 'مبيعات الشهر',
        data: [423, 534, 1200, 122, 644, 322, 1240, 1630, 234, 422, 543, 123],
        borderColor: '#2541b2',
        backgroundColor: 'Transparent',
        lineTension: 0.2
      }]
    },
    options: {
      plugins: {
        legend: {
          display: false 
        },
      },
      scales: {
        y: {
          beginAtZero: true
        },
        x: {
          position: 'top'
        },
      }
    }
  });

  const navigation = document.querySelector('.c-table__navigation');
  const randomArray = (myLength, max) => Array.from({length: myLength}, () => Math.round(Math.random() * max))


  navigation.addEventListener('click', () => {
    chart.data.datasets[0].data = randomArray(12, 1800);
    chart.update();
  });
</script>


{{/components-container}}
