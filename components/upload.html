{{#> components-container title="upload"}}
  <div class="c-upload js-upload">
    <header class="c-upload__header">
      <h4 class="c-upload__title">
        صورة المنتج
      </h4>
      <label for="upload-image" class="c-upload__label ">ارفع الصورة</label>
      <span class="c-upload__label c-upload__label--remove js-upload-remove">احذف الصورة</span>
    </header>

    <div class="c-upload__body">
      <div class="c-upload__image">
        <img class="js-image-placeholder">
      </div>
      <input type="file" name="upload-image" id="upload-image" class="c-upload__field js-upload-value" accept="image/*">
      <span class="c-upload__subtitle">
        اسحب الصورة هنا لرفعها
      </span>
    </div>
  </div>

  <div class="c-upload--small js-upload">
    <header class="c-upload__header">
      <h4 class="c-upload__title--small">
        صورة المستخدم
      </h4>
    </header>

    <div class="c-upload__body">
      <label for="upload-image" class="c-upload__label ">ارفع الصورة</label>
      <img class="js-image-placeholder"/>
      <input type="file" name="upload-image" id="upload-image" class="c-upload__field js-upload-value" accept="image/*">
    </div>
    <span class="c-upload__label c-upload__label--remove js-upload-remove">احذف الصورة</span>
  </div>


  <script>
    (function (){
      const uploaders = document.querySelectorAll('.js-upload');
      Array.from(uploaders, (uploader) => {
        const placeholder = uploader.querySelector('.js-image-placeholder'),
              uploadINP = uploader.querySelector('.js-upload-value'),
              remove = uploader.querySelector('.js-upload-remove');
        uploadINP.addEventListener('change', (e) => {
          const img = uploadINP.files[0];
          let reader = new FileReader;
          reader.readAsDataURL(img);

          reader.onloadend = () => {
            uploader.classList.add('has-image');
            placeholder.src = reader.result;
          }
        });
        remove.addEventListener('click', () => {
          uploadINP.value = null;
          placeholder.src = '';
          uploader.classList.remove('has-image');
        });
      });
    })();
  </script>
{{/components-container}}
