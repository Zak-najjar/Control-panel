<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اضافة مستخدم</title>
  <script type="module" crossorigin src="/ControlPanel-production/assets/sidebar-BAm6KRps.js"></script>
  <script type="module" crossorigin src="/ControlPanel-production/assets/upload-DuZxG-Ei.js"></script>
  <link rel="stylesheet" crossorigin href="/ControlPanel-production/assets/sidebar-Ba3Gkv-0.css">
</head>

<body>
  <div class="page-container">
      <div class="c-sidebar">
        <div class="c-sidebar__control">
          <a href="./index.html" class="c-sidebar__icon c-sidebar__icon--large c-sidebar__logo">
            <svg viewbox="0 0 35 35">
              <circle cx="17.5" cy="17.5" r="12" fill="transparent" stroke-width="10"></circle>
            </svg>
          </a>
          <a href="./add-product.html" class="c-sidebar__icon"><i class="fa-solid fa-plus"></i></a>
          <a href="#search" class="c-sidebar__icon"><i class="fa-solid fa-magnifying-glass"></i></a>
          <a href="#logout" class="c-sidebar__icon"><i class="fa-solid fa-power-off"></i></a>
          <a href="#profile" class="c-sidebar__icon c-sidebar__icon--bottom c-sidebar__icon--large c-sidebar__icon--image ">
            <img src="/ControlPanel-production/images/avatar.jpg" alt="avatar">
          </a>
        </div>
        <div class="c-sidebar__menu">
          <h2 class="c-sidebar__title"><a href="../index.html">عربي</a></h2>
          <nav class="c-sidebar__navigation">
            <a href="./index.html" class="c-sidebar__link">نظرة عامة <i class="fa-solid fa-bars"></i></a>
            <a href="./products.html" class="c-sidebar__link">المنتجات <i class="fa-solid fa-cart-shopping"></i></a>
            <a href="./users.html" class="c-sidebar__link">المستخدمين <i class="fa-solid fa-users"></i></a>
            <a href="./orders.html" class="c-sidebar__link">الطلبات <i class="fa-solid fa-boxes-stacked"></i></a>
          </nav>
        </div>
        <div class="c-sidebar__backdrop"></div>
      </div>
    <div class="single-page">
      <div class="page-header">
        <h1 class="page-title">إضافة مستخدم</h1>
        <button class="c-btn c-btn--primary" type="submit" name="add-product" form="productForm">مستخدم جديد</button>
      </div>
      <form action="" class="c-form" name="productForm">
        <div class="c-upload c-upload--small js-upload">
          <header class="c-upload__header">
            <h4 class=" c-upload__title c-upload__title--small">
              صورة المستخدم
            </h4>
          </header>
    
          <div class="c-upload__body">
            <label for="upload-image" class="c-upload__label ">ارفع الصورة</label>
            <img class="js-image-placeholder" />
            <input type="file" name="upload-image" id="upload-image" class="c-upload__field js-upload-value"
              accept="image/*">
          </div>
          <span class="c-upload__label c-upload__label--remove js-upload-remove">احذف الصورة</span>
        </div>
        <div class="c-form__controls">
          <div class="c-form__row">
            <div class="c-textfield">
              <label for="userName" class="c-textfield__label">اسم المستخدم</label>
              <input type="text" id="userName" class="c-textfield__input">
            </div>
          </div>
          <div class="c-form__row">
            <div class="c-textfield">
              <label for="email" class="c-textfield__label">البريد الإلكتروني</label>
              <input type="email" id="email" class="c-textfield__input">
            </div>
            <div class="c-textfield">
              <label for="emailConfirm" class="c-textfield__label">تأكيد البريد الإلكتروني</label>
              <input type="email" id="emailConfirm" class="c-textfield__input" >
            </div>
          </div>
          <div class="c-form__row">
            <div class="c-textfield">
              <label for="password" class="c-textfield__label">كلمة المرور</label>
              <input type="password" id="password" class="c-textfield__input">
            </div>
          </div>
          <div class="c-form__row">
            <div class="c-textfield">
              <label for="passwordConfirm" class="c-textfield__label">تأكيد كلمة المرور </label>
              <input type="password" id="passwordConfirm" class="c-textfield__input">
            </div>
          </div>
        </div>
      </form>
    </div>
    
    <div class="c-help">
      <i class="c-help__icon fa-solid fa-circle-info"></i>
      <div>
        <span class="c-help__text">
          تعلم المزيد حول
        </span>
        <a href="products.html" class="c-help__link">المنتجات</a>
      </div>
    </div>

  </div>

</body>

</html>
